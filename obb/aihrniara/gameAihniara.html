<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="menu.png">
<title>Aihniara menu</title>
<style>

body {
 margin: 0;
 overflow: hidden;
 background: #000;
 touch-action: none;
 align-items:center;
}
#mainMenu{
  position:absolute;left:0;top:0;width:100dvw;height:100dvh;
  background: url('menu.png');
 background-repeat:no-repeat;
 background-size:cover;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:30;
  border:12px solid;
  border-image: repeating-linear-gradient(90deg, #ff0000, #fff, #000, #ff0000) 12;
}
#mainMenu a{
text-decoration: none;
color:#000;
}
#mainMenu button{
  width:220px;padding:15px;margin:8px;
  background:#ffeb3b;border:4px solid #000;
  font-size:18px;font-weight:bold;
  box-shadow:6px 6px 0 #000;
  cursor:pointer;
}
#mainMenu button:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #000}

#okScreen{
display:none;
width:100dvw;
height:100dvh;
background:#87ceeb;
color:white;
align-items:center;
justify-content:center;
}

	</style>
	</head>
<body>

<div id="loadingNa" style="position:absolute; width:100%; height:100%; background:#87ceeb; display:flex; flex-decoration:column; justify-content:center; align-items:center; z-index:10;">
  <h2 style="color:white; font-family:Arial">LOADING...</h2>
   <div style="width:200px; height:20px; background:white; border-radius:10px; overflow:hidden;">
      <div id="loading" style="width:0%; height:100%; background:green; transition:0.2s;">
      </div>
   </div>
  <p id="loadText" style="color:white;">0%</p>
</div>

<div id="okScreen" onclick="okScreen()">touch the screen</div>

<div id="mainMenu">
  <button><a href="aihniara.html">Play</a></button>
  <button id="board">Leaderboard</button>
</div>

</body>
<script>

const menuImage = {
  bgImg: "menu.png",
};

let loaded = 0;
let toLoad = 0;


menuCheck();

function menuCheck(){
  toLoad = Object.keys(menuImage).length;

  for(let key in menuImage){
    let bimg = new Image();
    bimg.src = menuImage[key];

    bimg.onload = () => {
      loaded++;
      checkMenuImage();
      window[key] = bimg;
    };

    bimg.onerror = () => {
      loaded++;
      checkMenuImage();
    }
  }
}

function checkMenuImage(){
  let percent = Math.floor((loaded/toLoad)*100);
  document.getElementById("loading").style.width = percent + '%';
  document.getElementById("loadText").innerText = percent + '%';

  if(loaded >= toLoad){
      setTimeout(() =>{
	document.getElementById("loadingNa").style.display = "none";
	document.getElementById("okScreen").style.display = "flex";
    }, 500);
  }
}


function okScreen(){
  document.getElementById("okScreen").style.display = "none";
  document.getElementById("mainMenu").style.display = "flex";
}
</script>
</html>
