<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tawng lehlinna</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { background:#0f1115; color:#e6e8ef; min-height:100vh; }
.header { position:fixed; max-width:600px; width:100%; background:#0f1115; z-index:999; top:0; left:50%; transform:translateX(-50%); }
.card { width:100%; margin:auto; background:#181b27; padding:20px; border:1px solid #232738; border-radius:20px; }
.card h3 { text-align:center; color:#fff; margin:0; font-size:18px; font-weight:800; padding-bottom:20px; }
.card a { text-decoration:none; }
.card h3 span { color:#7c5cff; }
.row { display:flex; gap:10px; margin-bottom:16px; }
.row select { flex:1; background:#1e212e; color:#fff; border:1px solid #2d3246; padding:12px 14px; border-radius:12px; outline:none; font-size:14px; font-weight:600; }
.row select:focus { border-color:#7c5cff; }
#box { width:100%; background:#1a1d29; color:#fff; border:1.5px solid #2d3246; border-radius:14px; padding:16px; font-size:16px; outline:none; }
#box:focus { border-color:#7c5cff; }
.taksa { background:#0f1115; margin-top:220px; width:100%; }
.select { display:flex; justify-content:space-between; gap:6px; }
.select div { border:1px solid #2d3246; border-radius:8px; width:33%; margin-top:6px; height:30px; align-items:center; justify-content:center; display:flex; cursor:pointer; font-size:13px; }
.select div:hover { border-color:#7c5cff; }
.select #trans { background:#7c5cff; }
#takpeng { display:none; }
#conclus { display:none; }
#result, #zawn { padding:16px; display:grid; gap:10px; max-width:600px; margin:auto; }
#conclus { padding:16px; max-width:600px; margin:auto; }
.item { padding:14px 16px; background:#1e212e; border:1px solid #2d3246; border-radius:14px; }
.item:hover { border-color:#7c5cff; }
.item .tag { font-size:11px; background:#1e212e; border:1px solid #2d3246; color:#8b90a6; padding:2px 8px; border-radius:99px; margin-left:8px; }
.item small { display:none; }
.item:hover small { display:block; }
.items { padding:14px 16px; background:#1e212e; border:1px solid #B06B6B; border-radius:14px; }
b { font-size:15px; color:#1a73e8; }
.swap { cursor:pointer; justify-content:center; background:#252a3a; border:1px solid #2d3246; align-items:center; display:flex; border-radius:10px; height:40px; width:40px; color:#fff; }
.swap:hover { background:#7c5cff; }
#conclus a { text-decoration:none; color:#fff; }
#opt div { margin:16px 0; text-align:center; border:1px solid #232738; background:#181b27; border-radius:9px; padding:12px; }
#opt div:hover { border-color:#7c5cff; }
#loadMoreBtn { display:none; margin:10px auto 30px auto; padding:12px 25px; background:#7c5cff; color:#fff; border:none; border-radius:99px; font-size:15px; font-weight:700; cursor:pointer; max-width:600px; width:calc(100% - 32px); }
#loadMoreBtn:active { transform:scale(0.97); }
#countInfo { text-align:center; color:#8b90a6; font-size:13px; padding:5px; }
</style>
</head>
<body>

<div class="header">
<div class="card">
<a href="../index.html"><h3>Tawng<span>lehlinna</span></h3></a>
<div class="row">
<select id="fromLang">
<option value="lusei">Lusei</option>
<option value="hmar">Hmar</option>
</select>
<div class="swap" onclick="swapLang()"><=></div>
<select id="toLang">
<option value="hmar">Hmar</option>
<option value="lusei">Lusei</option>
</select>
</div>
<input id="box" type="text" placeholder="Zawn awlna....">
<div class="select">
<div id="trans">Translation</div>
<div id="sens">Sentence</div>
<div id="option">Option</div>
</div>
</div>
</div>

<div class="taksa">
<div id="takbody"><div id="zawn"></div></div>
<div id="takpeng"><div id="result"></div></div>
<div id="conclus">
<div id="opt">
<a href="tawngUpa.html"><div>Tawng upa leh Thuhar</div></a>
<a href="thufing.html"><div>Thufing</div></a>
<a href="../about.html"><div>About</div></a>
<a href="../contact.html"><div>Contact</div></a>
<a href="../privacy.html"><div>Privacy</div></a>
</div>
</div>
<div id="countInfo"></div>
<button id="loadMoreBtn">A dang zawng chhuak rawh ↓</button>
</div>

<script src="tawngtluang.js"></script>
<script src="dictionary.js"></script>
<script>
const sens = document.getElementById("sens");
const trans = document.getElementById("trans");
const takbody = document.getElementById("takbody");
const takpeng = document.getElementById("takpeng");
const option = document.getElementById("option");
const conclus = document.getElementById("conclus");
const loadMoreBtn = document.getElementById("loadMoreBtn");
const countInfo = document.getElementById("countInfo");

const unAll = document.querySelectorAll('#sens,#trans,#option');
const takAll = document.querySelectorAll('#takbody,#takpeng,#conclus');

// === TLEM TLEM LOAD NA TUR ===
let currentMode = 'trans'; // trans = Sentence (zawn), sens = Translation (result)
let filteredList = []; 
let shownCount = 0;
const PAGE_SIZE = 30;

function unSel(){
  unAll.forEach(sel=>{ sel.style.background = '#181b28'; });
  takAll.forEach(tak=>{ tak.style.display = 'none'; });
}
trans.onclick = function(){ unSel(); trans.style.background = '#7c5cff'; takbody.style.display = 'block'; currentMode='trans'; resetAndRender(); }
sens.onclick = function(){ unSel(); sens.style.background = '#7c5cff'; takpeng.style.display = 'block'; currentMode='sens'; resetAndRender(); }
option.onclick = function(){ unSel(); option.style.background = '#7c5cff'; conclus.style.display = 'block'; loadMoreBtn.style.display='none'; countInfo.innerText=''; }

function swapLang(){
  var f=document.getElementById("fromLang");
  var t=document.getElementById("toLang");
  var temp=f.value; f.value=t.value; t.value=temp;
  resetAndRender();
}

// A zawng hmasa, mahse a tilang lo - a list chauh a siam
function filterData(){
  var q=document.getElementById("box").value.toLowerCase().trim();
  var from=document.getElementById("fromLang").value;
  var to=document.getElementById("toLang").value;
  filteredList = [];
  // Mode a zirin data thlang
  let source = (currentMode === 'trans') ? (typeof thu !== 'undefined' ? thu : []) : (typeof data !== 'undefined' ? data : []);

  if(q === ""){
    filteredList = source;
  } else {
    for(let i=0; i<source.length; i++){
      let d = source[i];
      if(d[from] && d[from].toLowerCase().includes(q)){
        filteredList.push(d);
        if(filteredList.length >= 500);
      }
    }
  }
  return {from, to, q};
}

function resetAndRender(){
  shownCount = 0;
  document.getElementById("result").innerHTML = "";
  document.getElementById("zawn").innerHTML = "";
  renderNextPage();
}

function renderNextPage(){
  let {from, to, q} = filterDataIfNeeded();
  let container = (currentMode === 'trans') ? document.getElementById("zawn") : document.getElementById("result");
  if(shownCount === 0) container.innerHTML = "";

  let next = filteredList.slice(shownCount, shownCount + PAGE_SIZE);
  let html = "";
  for(let d of next){
    if(currentMode === 'trans'){
      html += `<div class='item'><b>${from.toUpperCase()}:</b> ${d[from]}<span class='tag'>${d.gr || ''}</span><br><b>${to.toUpperCase()}:</b> ${d[to]}<br><small style='color:grey'>${d.desc || ''}</small></div>`;
    } else {
      html += `<div class='item'><b>${from.toUpperCase()}:</b> ${d[from]}<br><b>${to.toUpperCase()}:</b> ${d[to]}</div>`;
    }
  }
  container.insertAdjacentHTML('beforeend', html);
  shownCount += next.length;

  // A awm loh chuan
  if(filteredList.length === 0 && shownCount === 0){
    container.innerHTML = `<div class='items'>'${q}' tih hi a awm rih lo.</div>`;
  }
  // Count + Load More button
  if(currentMode !== 'option'){
    countInfo.innerText = filteredList.length > 0 ? `${shownCount} / ${filteredList.length}` : '';
    if(shownCount < filteredList.length){
      loadMoreBtn.style.display = 'block';
      loadMoreBtn.innerText = `A dang ${Math.min(PAGE_SIZE, filteredList.length - shownCount)} zawng chhuak rawh ↓`;
    } else {
      loadMoreBtn.style.display = 'none';
    }
  }
}

// Filter hi a ngai loh chuan a ti nawn lo - a chak zawk nan
let lastQuery = null, lastFrom = null, lastTo = null, lastMode = null;
function filterDataIfNeeded(){
  var q=document.getElementById("box").value.toLowerCase().trim();
  var from=document.getElementById("fromLang").value;
  var to=document.getElementById("toLang").value;
  if(q !== lastQuery || from !== lastFrom || to !== lastTo || currentMode !== lastMode){
    filterData();
    lastQuery = q; lastFrom = from; lastTo = to; lastMode = currentMode;
    shownCount = 0;
    let c = (currentMode === 'trans') ? document.getElementById("zawn") : document.getElementById("result");
    if(c) c.innerHTML = "";
  }
  return {from, to, q};
}

loadMoreBtn.onclick = function(){ renderNextPage(); };

// Scroll a thlenin a mahin a lo load belh ang
window.addEventListener('scroll', ()=>{
  if(loadMoreBtn.style.display === 'block' && (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 500){
    renderNextPage();
  }
});

// === DEBOUNCE - I type zawh hnuah 300ms hnuah chauh a zawng ang ===
let debounceTimer;
document.getElementById("box").addEventListener("input", ()=>{
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(()=>{
    shownCount = 0;
    lastQuery = null;
    // Container ti fai
    let c = (currentMode === 'trans') ? document.getElementById("zawn") : document.getElementById("result");
    if(c) c.innerHTML = "";
    renderNextPage();
  }, 300);
});

// A hma find() kha hemi atan kan dah tawh - a hluiin a koh chuan a thawk tho ang
function find(){ lastQuery = null; renderNextPage(); }

document.getElementById('fromLang').addEventListener('change', ()=>{ lastQuery=null; renderNextPage(); });
document.getElementById('toLang').addEventListener('change', ()=>{ lastQuery=null; renderNextPage(); });

function loadOnStart(){
  if(typeof data == "undefined" || data.length == 0){ setTimeout(loadOnStart, 300); return; }
  if(typeof thu == "undefined" || thu.length == 0){ setTimeout(loadOnStart, 300); return; }
  resetAndRender();
}
window.addEventListener("load", loadOnStart);
</script>
</body>
</html>
