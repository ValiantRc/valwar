<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tawng lehlinna</title>
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f1115;
color:#e6e8ef;
min-height:100vh;
justify-items:center;
}

.header{
position:fixed;
max-width:600px;
height:100% auto;
width:100%;
background:#0f1115;
z-index:999;
  top:0;
}

.card{
width:100%;
margin:auto;
background:#181b27;
padding:20px;
border:1px solid #232738;
border-radius:20px;
}
.card h3{
text-align:center;
color:#fff;
margin:0;
font-size:18px;
font-weight:800px;
letter-spacing:-0.3px;
padding-bottom:20px;
}
.card a{
text-decoration:none;
}
.card h3 span{
color:#7c5cff;
}
.row{
display:flex;
gap:10px;
margin-bottom:16px;
}
.row select{
flex:1;
background:#1e212e;
color:#fff;
border:1px solid #2d3246;
padding:12px 14px;
border-radius:12px;
outline:none;
font-size:14px;
font-weight:600;
}
.row select:focus{
border-color:#7c5cff;
}
#box{
width:100%;
background:#1a1d29;
color:#fff;
border:1.5px solid #2d3246;
border-radius:14px;
padding:16px;
font-size:16px;
outline:none;
transition:0.2s;
}
#box:hover{
border-color:#7c5cff;
}
#box:focus{
border-color:#7c5cff;
}

.taksa{
background:#0f1115;
margin-top:220px;
width:100%;
height:100%;
}

.select{
display:flex;
justify-content:space-between;
}
.select div{
border:1px solid #2d3246;
border-radius:8px;
width:49%;
margin-top:6px;
height:25px;
align-items:center;
justify-content:center;
display:flex;
}
.select div:hover{
border-color:#7c5cff;
}


#result{
padding:16px;
display:grid;
gap:10px;
max-width:600px;
margin:auto;
}
#zawn{
padding:16px;
display:grid;
gap:10px;
max-width:600px;
margin:auto;
}
#conclus{
padding:16px;
  didplay:grid;
  gap:10px;
  max-width:600px;
  margin:auto;
}

.item{
padding:14px 16px;
background:#1e212e;
border:1px solid #2d3246;
border-radius:14px;
}
.item:hover{
border-color:#7c5cff;
}
.item .tag{
font-size:11px;
background:#1e212e;
border:1px solid #2d3246;
color:#8b90a6;
padding:2px 8px;
border-radius:99px;
margin-left:8px;
}
.items{
padding:14px 16px;
background:#1e212e;
border:1px solid #B06B6B;
border-radius:14px;
}
b{
font-size:15px;
color:#1a73e8;
}
.swap{
cursor:pointer;
justify-content:center;
background:#252a3a;
border:1px solid #32d3246;
align-items:center;
display:flex;
border-radius:10px;
height:40px;
width:40px;
color:#fff;
}
.swap:hover{
background:#7c5cff;
}

#conclus a{
text-decoration:none;
color:#ffff;
}

#opt div{
text-align:center;
border:1px solid #232738;
background:#181b27;
border-radius:9px;
padding:10px;
}
#opt div:hover{
border-color:#7c5cff;
  }

</style>
</head>
<body>

<div class="header">
<div class="card">
<a href="../index.html">
<h3>Tawng<span>lehlinna</span></h3>
</a>

<div class="row">
<select id="fromLang">
<option value="lusei">Lusei</option>
<option value="hmar">Hmar</option>
</select>

<div class="swap" onclick="swapLang()"><=></div>

<select id="toLang">
<option value="hmar">Hmar</option>
<option value="lusei">Lusei</option>
</select>
</div>

<input id="box" type="text" placeholder="Zawn awlna...." onkeyup="find()">

<div class="select">
<div id="trans">Translation</div>
<div id="sens">Sentence</div>
  <div id="option">option</div>
</div>

</div>
</div>

<div class="taksa">

<div id="takbody">
<div id="zawn"></div>
</div>

<div id="takpeng">
<div id="result"></div>
</div>

<div id="conclus">
<div id="opt">
<a href="tawngUpa.html"><div>Tawng upa leh Thuhar</div></a>
<a href="thufing.html"><div>Thufing</div></a>
<a href="../about.html"><div>About</div></a>
<a href="../contact.html"><div>Contact</div></a>
<a href="../privacy.html"><div>Privacy</div></a>
</div>

</div>

</body>

<script src="tawngtluang.js"></script>
<script src="dictionary.js"></script>
<script>

const sens = document.getElementById("sens");
const trans = document.getElementById("trans");

const takbody = document.getElementById("takbody");
const takpeng = document.getElementById("takpeng");

const option = document.getElementById("option");

const conclus = document.getElementById("conclus");
  
const unAll = document.querySelectorAll('#sens,#trans,#option');
const takAll = document.querySelectorAll('#takbody,#takpeng,#conclus');




function unSel(){
unAll.forEach(sel=>{
sel.style.background = '#181b28';
});
takAll.forEach(tak=>{
tak.style.display = 'none';
});
}

unSel();

trans.onclick = function(){
unSel();
trans.style.background = '#7c5cff';
takbody.style.display = 'block';
}

sens.onclick = function(){
unSel();
sens.style.background = '#7c5cff';
takpeng.style.display = 'block';
}
  
option.onclick = function(){
  unSel() ;
  option. style. background = '#7c5cff';
conclus.style.display = 'block';
}

function swapLang(){
var f=document.getElementById("fromLang");
var t=document.getElementById("toLang");
var temp=f.value;
f.value=t.value;
t.value=temp;
find();
}

function find(){
var q=document.getElementById("box").value.toLowerCase().trim();
var from=document.getElementById("fromLang").value;
var to=document.getElementById("toLang").value;
var r=document.getElementById("result");
var z=document.getElementById("zawn");
r.innerHTML="";
z.innerHTML="";

var found=0;

for(var i=0;i<data.length;i++){
var d=data[i];

if(q=="" || d[from].toLowerCase().indexOf(q)>=0){
found++;
r.innerHTML += "<div class='item'><b>"+from.toUpperCase()+":</b>"+d[from]+"<br><b>"+to.toUpperCase()+":</b>"+d[to]+"</div>";
}
}
if(found==0){
r.innerHTML ="<div class='items'>'"+q+"' tih hi ah a awm rihlo.</div>";
}
for(var i=0;i<thu.length;i++){
var t=thu[i];

if(q=="" || t[from].toLowerCase().indexOf(q)>=0){
found++;
z.innerHTML += "<div class='item'><b>"+from.toUpperCase()+":</b>"+t[from]+"<span class='tag'>"+t.gr+"</span><br><b>"+to.toUpperCase()+":</b>"+t[to]+"<br><small style='color:grey'>"+t.desc+"</small></div>";
}
}
if(found==0){
z.innerHTML ="<div class='items'>'"+q+"' tih hi ah a awm rihlo.</div>";
}
}
function loadOnStart(){
if(typeof data == "undefined" || data.length == 0){
setTimeout(loadOnStart, 300);
return;
}
if(typeof thu == "undefined" || thu.length == 0){
setTimeout(loadOnStart, 300);
return;
}
find();
}
window.addEventListener("load", loadOnStart);
document.getElementById('fromLang').addEventListener('change', find);
document.getElementById('toLang').addEventListener('change', find);
</script>
</html>
