<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gameBox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    background: radial-gradient(circle at top, #1a2a4a, #060a14);
    color:white;
    font-family: 'Poppins', sans-serif;
    display:flex; flex-direction:column;
  }
  .header{
    padding:20px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  #logo{
    font-family:'Orbitron'; font-weight:800; font-size:22px;
    color:#00f2ff; text-shadow: 0 0 10px #00f2ff;
  }
  .container{
    flex:1; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius:22px;
    width:100%; max-width:340px;
    overflow:hidden;
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }
  /* Hei hi a pawimawh - a link */
  .game-link{
    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
    padding:14px;
    transition:0.2s;
  }
  .game-link:hover{
    background: rgba(255,255,255,0.08);
  }
  .game-link img{
    width:70px; height:70px;
    border-radius:14px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,0.2);
  }
  .game-link span{
    font-family:'Orbitron';
    font-weight:700;
    font-size:20px;
    color:white;
    letter-spacing:1px;
  }
  .game-link:active{ transform: scale(0.98); }
</style>
</head>
<body>

  <div class="header">
    <div id="logo">gameBox</div>
  </div>

  <div class="container">
    <div class="card">
      <a href="aihniara/gameAihniara.html" class="game-link">
        <img src="game.jpg" alt="game">
        <span>Aihniara</span>
      </a>
    </div>
  </div>

</body>
</html>
